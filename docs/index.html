<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NarxRadar</title>
<meta name="theme-color" content="#0a7c76">
<meta name="description" content="Bozor va doʻkon narxlarini rasm yoki matn orqali tekshirish, narx indeksi va soxta chegirmalarni aniqlash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NarxRadar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Telefon ilovasi: yuqori panel + aylanadigan ekran + pastki menyu. Firuza koshin aksenti, sovuq kulrang fon, katta tugmalar. */
  --bg:#eef2f1; --surface:#ffffff; --surface2:#f4f7f6; --ink:#13242a; --ink2:#53656a; --line:#d8e1df;
  --accent:#0a7c76; --accent-ink:#ffffff; --accent-soft:#d6eeeb;
  --good:#1b8048; --good-soft:#dcf1e4; --warn:#a96500; --warn-soft:#fbeacd; --crit:#bf2f29; --crit-soft:#f8dcda; --cheap:#1d5fae; --cheap-soft:#dae6f7;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(19,36,42,.06),0 4px 14px rgba(19,36,42,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1517; --surface:#142124; --surface2:#1a2a2e; --ink:#e3eeec; --ink2:#9fb2b2; --line:#27393c;
    --accent:#3dbfb4; --accent-ink:#04201d; --accent-soft:#163a37;
    --good:#53c483; --good-soft:#15331f; --warn:#f0a63a; --warn-soft:#3a2a10; --crit:#ff7b71; --crit-soft:#3e1b19; --cheap:#73adf2; --cheap-soft:#152740;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1517; --surface:#142124; --surface2:#1a2a2e; --ink:#e3eeec; --ink2:#9fb2b2; --line:#27393c;
  --accent:#3dbfb4; --accent-ink:#04201d; --accent-soft:#163a37;
  --good:#53c483; --good-soft:#15331f; --warn:#f0a63a; --warn-soft:#3a2a10; --crit:#ff7b71; --crit-soft:#3e1b19; --cheap:#73adf2; --cheap-soft:#152740;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:560px){
  body{align-items:center;padding:16px 0}
  .app{height:min(920px,100%);border:1px solid var(--line);border-radius:30px;box-shadow:0 24px 70px rgba(10,30,35,.16)}
}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo b{font-family:var(--display);font-size:17px;letter-spacing:-.01em}
.locchip{margin-left:auto;display:flex;align-items:center;gap:6px;max-width:62%;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:600;text-align:left}
.locchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locchip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink2);flex:none}
.locchip.ok .dot{background:var(--good)}
.locchip.warn .dot{background:var(--warn)}
/* views */
.view{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--ink2);font-size:11.5px;font-weight:600;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card h2{font-size:17px}
.card h3{font-size:15px}
.sub{color:var(--ink2);font-size:13.5px;margin:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.hello h1{font-family:var(--display);font-size:22px;line-height:1.2;letter-spacing:-.01em}
.hello p{margin:6px 0 0;color:var(--ink2)}
.cta{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.cta button{border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-weight:700;font-size:17px;line-height:1.2;min-height:132px}
.cta button small{font-weight:500;font-size:13px;opacity:.85}
.cta .cam{background:var(--accent);color:var(--accent-ink);border:0}
.cta .write{background:var(--surface);border:1.5px solid var(--line)}
.cta svg{width:34px;height:34px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px;text-align:left}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.btn2 svg{width:22px;height:22px;flex:none}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:20px;font-weight:800}
.tile span{font-size:12.5px;color:var(--ink2)}
.big{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.unit{font-size:14px;font-weight:600;color:var(--ink2);font-family:var(--body)}
.chg{font-size:13px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap}
.chg.up{color:var(--crit);background:var(--crit-soft)}
.chg.dn{color:var(--good);background:var(--good-soft)}
.chg.eq{color:var(--ink2);background:var(--surface2)}
/* verdict pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.adolatli,.pill.haqiqiy{color:var(--good);background:var(--good-soft)}
.pill.qimmat,.pill.chalgituvchi{color:var(--warn);background:var(--warn-soft)}
.pill.juda,.pill.soxta{color:var(--crit);background:var(--crit-soft)}
.pill.arzon{color:var(--cheap);background:var(--cheap-soft)}
.pill.sm{padding:3px 9px;font-size:12.5px}
.pill.lg{font-size:18px;padding:9px 16px}
.pill.lg svg{width:20px;height:20px}
.stripe{border-left:5px solid var(--line)}
.stripe.adolatli,.stripe.haqiqiy{border-left-color:var(--good)}
.stripe.qimmat,.stripe.chalgituvchi{border-left-color:var(--warn)}
.stripe.juda,.stripe.soxta{border-left-color:var(--crit)}
.stripe.arzon{border-left-color:var(--cheap)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.li .p{font-weight:700}
.ico{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:var(--accent)}
.cathead{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin:8px 0 0}
/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:112px 1fr 76px;align-items:center;gap:8px;font-size:13px}
.bar .track{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--accent);opacity:.55}
.bar.me .fill{opacity:1}
.bar.me{font-weight:700}
.bar .v{text-align:right}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp .bar{grid-template-columns:118px 1fr 84px}
.cmp .bar.you .fill{background:var(--ink);opacity:.85}
/* inputs */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2)}
input.in,select.in{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;color:var(--ink)}
input.in.huge{font-size:20px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.parse{display:flex;flex-wrap:wrap;gap:6px}
.parse span{font-size:13px;padding:5px 10px;border-radius:10px;background:var(--surface2)}
.parse span.ok{background:var(--good-soft);color:var(--good)}
.parse span.no{background:var(--warn-soft);color:var(--warn)}
.search{position:relative}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink2)}
/* sheet */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;transform:translateY(102%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet header{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 12px 12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet header h2{font-size:17px;flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.sheet .body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow-y:auto;padding:calc(28px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 20px calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));gap:16px}
.overlay[hidden]{display:none}
/* steps */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.step .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--ink2)}
.step.run .st{border:3px solid var(--accent-soft);border-top-color:var(--accent);background:none;animation:spin .9s linear infinite}
.step.ok .st{background:var(--good);color:#fff}
.step.bad .st{background:var(--warn);color:#fff}
.step .st svg{width:15px;height:15px}
.step small{display:block;font-weight:500;color:var(--ink2);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.step.run .st{animation:none}.sheet{transition:none}}
.photo{width:100%;max-height:220px;object-fit:contain;border-radius:14px;background:var(--surface2)}
.checks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.checks li svg{width:18px;height:18px;flex:none;margin-top:2px}
.checks .ok svg{color:var(--good)}
.checks .no svg{color:var(--warn)}
.why{display:flex;flex-direction:column;gap:10px}
.why .w{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.why .w b{font-weight:600}
.why .w .pts{font-weight:700;color:var(--ink2);font-size:13px}
.why .w .tx{grid-column:1/-1;color:var(--ink2);font-size:13.5px}
.why .w .pb{grid-column:1/-1;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.why .w .pb i{display:block;height:100%;background:var(--warn)}
.meter{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%}
.note{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 12px;margin:0}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.ai{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.ai b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.pipe{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none;counter-reset:p}
.pipe li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;font-size:14px;counter-increment:p}
.pipe li::before{content:counter(p);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.pipe li b{display:block}
.uses{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.uses li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.uses li .who{grid-column:2;font-size:12.5px;color:var(--accent);font-weight:700}
.uses li .ic{grid-row:1/3;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;color:var(--ink2);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tb td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb .r{text-align:right}
.tbwrap{overflow-x:auto}
.regiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.regiongrid button{padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-align:left}
.regiongrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.spark{width:100%;height:90px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;z-index:40;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink2);font-size:14px}
.onb-logo{display:flex;align-items:center;gap:10px}
.onb-logo b{font-family:var(--display);font-size:24px}
.onb h1{font-family:var(--display);font-size:24px;line-height:1.2}
.feat{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.feat li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.feat li .ico{width:40px;height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="11" fill="var(--accent)"/><circle cx="20" cy="22" r="12" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" opacity=".5"/><circle cx="20" cy="22" r="6.5" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" opacity=".8"/><path d="M20 22 L30 12.5" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="22" r="2.5" fill="var(--accent-ink)"/></svg>
      <b>NarxRadar</b>
    </div>
    <button class="locchip" id="locchip" aria-label="Joylashuv"><i class="dot"></i><span id="loctext">Joylashuv…</span></button>
  </header>

  <main class="view" id="v-asosiy" aria-label="Asosiy"></main>
  <main class="view" id="v-narxlar" aria-label="Narxlar" hidden></main>
  <main class="view" id="v-indeks" aria-label="Indeks" hidden></main>
  <main class="view" id="v-chegirma" aria-label="Chegirma" hidden></main>
  <main class="view" id="v-malumot" aria-label="Maʼlumot" hidden></main>

  <nav class="tabbar" aria-label="Boʻlimlar">
    <button data-tab="asosiy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Asosiy</button>
    <button data-tab="narxlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Narxlar</button>
    <button data-tab="indeks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></svg>Indeks</button>
    <button data-tab="chegirma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>Chegirma</button>
    <button data-tab="malumot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Maʼlumot</button>
  </nav>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title"></h2><button class="iconbtn" id="sheet-close" aria-label="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="body" id="sheet-body"></div>
  </section>

  <section class="overlay onb" id="onb" hidden aria-label="Xush kelibsiz"></section>
  <div class="toast" id="toast" role="status" hidden></div>

  <input type="file" id="f-cam" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
  <input type="file" id="f-gal" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
</div>

<script src="config.js"></script>
<script>

  }

  const above = now / typ - 1;
  parts.push({ l: "Aksiya narxi odatdagidan arzonmi?", pts: 15 * clamp01((above + .03) / .08), max: 15, tx: above >= -.03 ? `Aksiya narxi ${fmt(now)} soʻm ${typLbl}dan (${fmt(typ)} soʻm) arzon emas.` : `Aksiya narxi ${typLbl}dan ${pct(-above, 0)} arzon.` });
  const since60 = Date.now() - 60 * 864e5;
  const weeks = new Set(place ? ALL().filter(x => x.c === c && x.old && Date.parse(x.t) >= since60 && ((x.loc && (x.loc.chain || x.loc.pl)) === place)).map(x => x.wk) : []);
  parts.push({ l: "Tugamaydigan aksiya", pts: weeks.size >= 4 ? 10 : 0, max: 10, tx: place ? `Soʻnggi 60 kunda shu joyda ${weeks.size} xil haftada aksiya qayd etilgan.` : "Joy nomi nomaʼlum, tekshirib boʻlmadi." });
  const score = Math.round(parts.reduce((s, x) => s + x.pts, 0));
  return { lab: score >= 55 ? "soxta" : score >= 25 ? "chalgituvchi" : "haqiqiy", score, claim, real, parts, typ, hi, low30 };
}

const BASKET = () => REF.products.filter(p => p.q > 0);
function basketCost(r, mode = "now") { let s = 0; for (const p of BASKET()) { const v = mode === "now" ? (r ? (regPrice(p.c, r) || p.p) : p.p) : mode === "prev" ? p.p - p.w : p.p - p.y; s += v * p.q; } return s; }
function crowdBasket(r) {
  let s = 0, cov = 0, tot = 0;
  for (const p of BASKET()) { const off = r ? (regPrice(p.c, r) || p.p) : p.p; const cr = crowd(p.c, r, 14); const v = cr.n >= 3 ? cr.med : off; s += v * p.q; tot += off * p.q; if (cr.n >= 3) cov += off * p.q; }
  return { s, cov: tot ? cov / tot : 0, off: tot };
}
function weeklyRatio() {
  const by = {};
  for (const x of ALL()) { if (!accepted(x) || !P[x.c]) continue; (by[x.wk] ||= {})[x.c] ||= []; by[x.wk][x.c].push(x.up / P[x.c].p); }

}

function sparkline(wr) {
  const W = 360, H = 90, pad = 8, ys = wr.map(x => x.ratio), lo = Math.min(.9, ...ys), hi = Math.max(1.1, ...ys);
  const X = i => pad + i * (W - 2 * pad) / (wr.length - 1), Y = v => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
  const d = wr.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x.ratio).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Xalq narxi rasmiy narxga nisbatan, haftalar boʻyicha"><line x1="${pad}" x2="${W - pad}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--line)" stroke-dasharray="4 4"/><path d="${d}L${X(wr.length - 1)},${H - pad}L${X(0)},${H - pad}Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${X(wr.length - 1)}" cy="${Y(ys[ys.length - 1])}" r="4.5" fill="var(--accent)"/><text x="${pad}" y="${Y(1) - 4}" font-size="11" fill="var(--ink2)">rasmiy = 1,00</text></svg><p class="sub">Oxirgi hafta: xalq narxi rasmiydan ${pct(ys[ys.length - 1] - 1)} (${wr[wr.length - 1].n} ta xabar).</p>`;
}

function toCSV() {
  const rows = [["vaqt", "hafta", "kod", "mahsulot", "yozilgan_nom", "narx", "qadoq", "birlik_narxi", "birlik", "eski_narx", "manba", "ai_ishonchi", "viloyat", "joy", "joy_turi", "joylashuv_usuli", "kenglik", "uzunlik", "baho", "farq", "chegirma_bahosi", "qabul", "ogirlik"]];
  for (const x of ALL()) rows.push([x.t, x.wk, x.c, P[x.c].n, x.pt || "", x.price, x.q, Math.round(x.up), P[x.c].u, x.old || "", x.src, x.conf || "", x.loc && x.loc.r || "", x.loc && (x.loc.chain || x.loc.pl) || "", x.loc && x.loc.ty || "", x.loc && x.loc.m || "", x.loc && x.loc.la || "", x.loc && x.loc.lo || "", x.v ? x.v.lab : "", x.v ? (x.v.g * 100).toFixed(1) : "", x.d || "", accepted(x) ? 1 : 0, x.qa ? x.qa.w : ""]);
  return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n");
}

function openWrite(prefill = "") {
  let ty = (LOC && LOC.ty) || "bozor", disc = false, chosen = null;
  openSheet("Yozib yuborish", `
  <label class="f" for="w-t">Nima va qancha?<input class="in huge" id="w-t" autocomplete="off" placeholder="Masalan: mol goʻshti 132 000" value="${esc(prefill)}"></label>
  <div class="parse" id="w-parse" aria-live="polite"></div>
  <div><p class="cathead" style="margin:0 0 8px">Yoki mahsulotni tanlang</p><div class="chips" id="w-chips">${POPULAR.map(c => `<button class="chip" data-c="${c}" aria-pressed="false">${esc(P[c].n)}</button>`).join("")}</div></div>
  <label class="f" for="w-p">Narx, soʻm<input class="in huge num" id="w-p" inputmode="numeric" placeholder="132 000"></label>
  <div><p class="cathead" style="margin:0 0 8px">Qayerda?</p><div class="seg" role="group" aria-label="Joy turi" id="w-ty"><button data-ty="bozor">Bozor</button><button data-ty="supermarket">Supermarket</button><button data-ty="dokon">Doʻkon</button></div></div>
  <button class="chip" id="w-disc" aria-pressed="false">Chegirma bor (eski narxni ham yozaman)</button>
  <label class="f" for="w-old" id="w-oldw" hidden>Eski narx, soʻm<input class="in num" id="w-old" inputmode="numeric" placeholder="160 000"></label>
  <button class="btn" id="w-go" disabled>Tekshirish va yuborish</button>
  <p class="note">${IC.pin.replace("<svg", '<svg style="width:15px;height:15px;vertical-align:-2px"')} Joylashuv avtomatik qoʻshiladi: ${esc(locLine(LOC))}. Bozor yoki doʻkon nomini yozsangiz (masalan “Chorsu” yoki “Korzinka”), u ham aniqlanadi.</p>`);
  SHEET_LOCK = true;
  const setTy = t => { ty = t; document.querySelectorAll("#w-ty button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ty === t))); };
  setTy(ty);
  document.querySelectorAll("#w-ty button").forEach(b => b.onclick = () => setTy(b.dataset.ty));
  const upd = () => {
    const t = $("#w-t").value, pr = parseText(t);
    const tp = placeFromText(t); if (tp && tp.ty) setTy(tp.ty);
    const c = chosen || pr.c, price = +String($("#w-p").value).replace(/\D/g, "") || pr.price;
    if (pr.old && !disc) { disc = true; $("#w-disc").setAttribute("aria-pressed", "true"); $("#w-oldw").hidden = false; $("#w-old").value = pr.old; }
    $("#w-parse").innerHTML = t.trim() || chosen ? `<span class="${c ? "ok" : "no"}">Mahsulot: ${c ? esc(P[c].n) : "aniqlanmadi"}</span><span class="${price ? "ok" : "no"}">Narx: ${price ? fmt(price) + " soʻm" : "yoʻq"}</span>${pr.qty ? `<span class="ok">Miqdor: ${dec(pr.qty, pr.qty % 1 ? 2 : 0)} ${pr.qunit}</span>` : ""}${tp && tp.pl ? `<span class="ok">Joy: ${esc(tp.pl)}</span>` : ""}` : "";
    $("#w-go").disabled = !(t.trim() || (chosen && price));
  };
  $("#w-t").oninput = upd; $("#w-p").oninput = upd;
  document.querySelectorAll("#w-chips [data-c]").forEach(b => b.onclick = () => { chosen = chosen === +b.dataset.c ? null : +b.dataset.c; document.querySelectorAll("#w-chips [data-c]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.c === chosen))); upd(); });
  $("#w-disc").onclick = () => { disc = !disc; $("#w-disc").setAttribute("aria-pressed", String(disc)); $("#w-oldw").hidden = !disc; };
  $("#w-go").onclick = async () => {
    const t = $("#w-t").value, pr = parseText(t);
    let c = chosen || pr.c, price = +String($("#w-p").value).replace(/\D/g, "") || pr.price, qty = pr.qty, qunit = pr.qunit, old = disc ? (+String($("#w-old").value).replace(/\D/g, "") || pr.old) : null;
    let pt = t.trim() || (c ? P[c].n : "");
    if ((!c || !price) && CAP.sample && t.trim()) {
      $("#w-go").disabled = true; $("#w-go").textContent = "AI tushunmoqda…";
      try { const a = await aiParseText(t); if (a) { if (!c && P[a.product_code]) c = a.product_code; if (!c && a.product_text) c = matchProduct(a.product_text).c; if (!price && a.price_uzs) price = +a.price_uzs; if (!qty && a.pack_qty) { qty = +a.pack_qty; qunit = a.pack_unit; } if (!old && a.old_price_uzs) old = +a.old_price_uzs; } } catch (e) { }
      $("#w-go").disabled = false; $("#w-go").textContent = "Tekshirish va yuborish";
    }
    if (!c) { $("#w-parse").innerHTML = `<span class="no">Mahsulotni tushunmadim. Roʻyxatdan tanlang yoki boshqacha yozing.</span>`; return; }
    if (!price) { $("#w-parse").innerHTML = `<span class="no">Narxni yozing (masalan 132 000).</span>`; $("#w-p").focus(); return; }
    if (old && old <= price) old = null;
    submitFlow({ src: "matn", kind: old ? "chegirma" : "narx", items: [{ c, price, qty, qunit, old, pt }], text: t, tyHint: ty });
  };
  upd(); setTimeout(() => $("#w-t").focus(), 300);
}

/* Rasm tanlash */
let PICK_KIND = "narx";
async function nativePhoto(C, kind, camera) {
  try {
    const r = camera ? await C.takePhoto({ quality: 85, targetWidth: 1600, targetHeight: 1600, correctOrientation: true, saveToGallery: false, editable: "no" })
      : ((await C.chooseFromGallery({ mediaType: 0, allowMultipleSelection: false, limit: 1, quality: 85 })).results || [])[0];
    if (!r || !r.webPath) return;
    const blob = await (await fetch(r.webPath)).blob();
    photoFlow(blob, kind, null);
  } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast("Kamera ochilmadi. Telefon sozlamalarida NarxRadar uchun kamera ruxsatini yoqing."); }
}
function pickPhoto(kind, camera) { const C = NP("Camera"); if (C) { nativePhoto(C, kind, camera); return; } PICK_KIND = kind; const inp = camera ? $("#f-cam") : $("#f-gal"); inp.value = ""; inp.click(); }
["#f-cam", "#f-gal"].forEach(s => $(s).addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) photoFlow(f, PICK_KIND, null); }));
async function runDemo(kind) { const { canvas, demo } = drawTag(kind); const blob = await canvasBlob(canvas); photoFlow(blob, kind, demo); }

async function shareText(title, text) {
  const S = NP("Share");
  try { if (S) { await S.share({ title, text, dialogTitle: "Ulashish" }); return; } if (navigator.share) { await navigator.share({ title, text }); return; } await navigator.clipboard.writeText(text); toast("Matn nusxalandi: Telegram’ga joylashingiz mumkin."); }
  catch (e) { }
}
function stepsHTML(steps) { return `<div class="steps">${steps.map(s => `<div class="step ${s.st}"><span class="st">${s.st === "ok" ? IC.ok : s.st === "bad" ? IC.warn : ""}</span><span>${esc(s.l)}${s.d ? `<small>${esc(s.d)}</small>` : ""}</span></div>`).join("")}</div>`; }

async function photoFlow(file, kind, demo) {
  SHEET_LOCK = true;
  const url = URL.createObjectURL(file);
  const S = [{ l: "AI rasmni oʻqiydi", st: "run" }, { l: "Joylashuv", st: "" }, { l: "Rasmiy narx bilan solishtirish", st: "" }, { l: "Avtomatik tekshiruv", st: "" }];
  const draw = () => { $("#sheet-body").innerHTML = `<img class="photo" src="${url}" alt="Yuborilgan narx yorligʻi">${stepsHTML(S)}<div id="pf-extra"></div>`; };
  openSheet(kind === "chegirma" ? "Chegirma tekshiruvi" : "Narx tekshiruvi", ""); draw();
  let res = null, how = "AI";
  if (CAP.sample && CAP.img) {
    try { res = await aiReadPhoto(await shrink(file)); } catch (e) { res = null; S[0].d = aiErr(e); }
  }
  if (!res && demo) { res = demo; how = "namuna"; S[0].d = CAP.sample && CAP.img ? "AI javob bermadi: namunaviy yorliqning maʼlum qiymatlari ishlatildi" : "AI server ulanmagan: namunaviy yorliqning maʼlum qiymatlari ishlatildi"; }
  else if (res && demo) how = "namuna-ai";
  if (!res || !res.is_price_tag || !res.items || !res.items.length || !res.items[0].price_uzs) {
    S[0].st = "bad"; S[0].d = S[0].d || (res ? "Rasmda oʻqiladigan narx topilmadi. Yorliqni yaqinroqdan, tekis suratga oling." : "AI server ulanmagan, shuning uchun rasmni oʻqib boʻlmaydi.");
    draw();
    $("#pf-extra").innerHTML = `<p class="note">Narxni yozib yuborishingiz mumkin: tekshiruv xuddi shunday avtomatik boʻladi.</p><button class="btn" id="pf-write">Yozib yuborish</button><button class="btn2" id="pf-again">Qayta suratga olish</button>`;
    $("#pf-write").onclick = () => openWrite(); $("#pf-again").onclick = () => pickPhoto(kind, true);
    return;
  }
  S[0].st = "ok"; S[0].d = S[0].d || `Oʻqildi: “${res.items.map(i => i.product_text).join(", ")}” · ishonch: ${({ high: "yuqori", medium: "oʻrtacha", low: "past" })[res.confidence] || "nomaʼlum"}`;
  draw();
  const items = res.items.slice(0, 4).map(i => {
    let c = P[i.product_code] ? +i.product_code : matchProduct(i.product_text || "").c;
    const ptext = String(i.product_text || "");
    const chk = matchProduct(ptext); if (chk.c && chk.s >= .9 && chk.c !== c) c = chk.c;
    let qunit = i.pack_unit, qty = i.pack_qty ? +i.pack_qty : null;
    return { c, price: +i.price_uzs, qty, qunit, old: i.old_price_uzs ? +i.old_price_uzs : null, pt: ptext.slice(0, 80) };
  }).filter(i => i.c && i.price > 0);
  if (!items.length) { S[0].st = "bad"; S[0].d = `“${res.items[0].product_text}” oʻqildi, lekin bu mahsulot hali kuzatiladigan 30 ta mahsulot qatorida yoʻq.`; draw(); return; }
  submitFlow({ src: how.startsWith("namuna") ? "namuna" : "rasm", kind, items, file, store: res.store_name, aiType: res.place_type, conf: res.confidence, issue: res.photo_issue, steps: S, url, redraw: draw });
}

async function submitFlow(o) {
  SHEET_LOCK = true;
  const S = o.steps || [{ l: "Matn tahlil qilindi", st: "ok", d: o.items.map(i => `${P[i.c].n} · ${fmt(i.price)} soʻm`).join(", ") }, { l: "Joylashuv", st: "" }, { l: "Rasmiy narx bilan solishtirish", st: "" }, { l: "Avtomatik tekshiruv", st: "" }];
  const draw = o.redraw || (() => { $("#sheet-body").innerHTML = `${stepsHTML(S)}<div id="pf-extra"></div>`; });
  if (!o.steps) openSheet(o.kind === "chegirma" ? "Chegirma tekshiruvi" : "Narx tekshiruvi", "");
  S[1].st = "run"; draw();
  let loc = await resolveLocation({ file: o.file, text: o.text, store: o.store, aiType: o.aiType });
  if (!loc) {
    S[1].st = "bad"; S[1].d = "Avtomatik aniqlab boʻlmadi"; draw();
    const r = await new Promise(res => {
      $("#pf-extra").innerHTML = `<section class="card"><h3>Qaysi hududdasiz?</h3><p class="sub">Bir marta tanlang, keyingi safar eslab qolinadi.</p>${regionGrid(null)}</section>`;
      document.querySelectorAll("#pf-extra [data-r]").forEach(b => b.onclick = () => res(b.dataset.r));
    });
    loc = { la: null, lo: null, r, pl: null, ty: null, m: "tanlangan", ts: Date.now() }; saveLoc(loc);
    const tp = placeFromText([o.text, o.store].filter(Boolean).join(" ")); if (tp) { if (tp.pl) loc.pl = tp.pl; if (tp.ty) loc.ty = tp.ty; if (tp.chain) loc.chain = tp.chain; }
    $("#pf-extra").innerHTML = "";
  }
  if (o.tyHint && (!loc.ty || o.src === "matn")) loc = { ...loc, ty: o.tyHint };
  if (!loc.ty) loc.ty = o.aiType || "bozor";
  S[1].st = "ok"; S[1].d = `${locLine(loc)} · ${LOCM[loc.m] || loc.m}${loc.via === "matn" && loc.m !== "matn" ? " + yozuvdan" : ""}`;
  S[2].st = "run"; draw();
  await new Promise(r => setTimeout(r, 250));
  const t = new Date(), wk = isoWeek(t), reps = [];
  for (const it of o.items) {
    const q = baseQty(it.c, it.qty, it.qunit, it.price), up = it.price / q;
    const rep = { id: uid8(), t: t.toISOString(), wk, c: it.c, pt: it.pt, price: it.price, q: +q.toFixed(3), up: Math.round(up), old: it.old || null, src: o.src, conf: o.conf || null, issue: o.issue || null, loc: { r: loc.r, pl: loc.pl || null, chain: loc.chain || null, ty: loc.ty, m: loc.m, la: loc.la ?? null, lo: loc.lo ?? null } };
    const v = priceVerdict(rep.c, rep.up, loc.r, loc.ty);
    rep.v = { lab: v.lab, g: +v.g.toFixed(4), b: Math.round(v.bench), bl: v.benchLbl };
    let dv = null;
    if (rep.old) { const oq = rep.old / q; dv = discountVerdict({ c: rep.c, was: oq, now: rep.up, r: loc.r, ty: loc.ty, pl: loc.pl, chain: loc.chain, excl: rep.id }); rep.d = dv.lab; rep.ds = dv.score; }
    rep.qa = quality(rep);
    reps.push({ rep, v, dv });
  }
  S[2].st = "ok"; S[2].d = reps.map(({ rep, v }) => `${P[rep.c].n}: ${v.benchLbl} ${fmt(v.bench)} soʻm`).join("; ");
  S[3].st = "run"; draw();
  const saved = [];
  for (const x of reps) saved.push(o.src === "namuna" ? "namuna" : await saveRep(x.rep));
  S[3].st = reps.every(x => x.rep.qa.ok) ? "ok" : "bad";
  S[3].d = reps.map(x => x.rep.qa.ok ? "qabul qilindi" : "indeksga kiritilmadi").join(", ") + (saved[0] === "baza" ? " · umumiy bazaga yozildi" : saved[0] === "qurilma" ? " · shu qurilmada saqlandi" : " · namunaviy yorliq: bazaga yozilmadi");
  draw();
  showResult(reps, o, saved);
}

function showResult(reps, o, saved) {

    const p = P[rep.c], mx = Math.max(rep.up, v.bench, v.rep, v.cr.n ? v.cr.med : 0, v.sm ? v.sm.max : 0);

    const sentence = v.lab === "arzon" ? `Bu narx ${v.benchLbl}dan ${pct(-v.g, 0)} arzon. Yaxshi narx.` : v.lab === "adolatli" ? `Bu narx ${v.benchLbl}ga yaqin (${pct(v.g, 0)}). Odatiy oraliqda.` : v.lab === "qimmat" ? `Bu narx ${v.benchLbl}dan ${pct(v.g, 0)} qimmat. Boshqa rastani koʻrib chiqing.` : `Bu narx ${v.benchLbl}dan ${pct(v.g, 0)} qimmat. Xavf signali sifatida tahlilga yuborildi.`;

      <div class="big num">${fmt(rep.up)} <span class="unit">${perU(rep.c)}</span></div>
      ${rep.q !== 1 ? `<p class="sub">Yorliqda ${fmt(rep.price)} soʻm, ${dec(rep.q * (p.u === "10 dona" ? 10 : 1), rep.q % 1 && p.u !== "10 dona" ? 2 : 0)} ${p.u === "10 dona" ? "dona" : unitTxt(p.u)} uchun → bir ${p.u === "10 dona" ? "oʻnlik" : unitTxt(p.u)} narxi hisoblandi.</p>` : ""}
      <div>${pill(v.lab, "lg")}</div>
      <p style="margin:0">${sentence}</p>
      <div class="cmp">${barRow("Siz yuborgan", rep.up, "you me")}${v.reg ? barRow(esc(RG[rep.loc.r].s) + " oʻrt.", v.reg) : ""}${barRow("Respublika oʻrt.", v.rep)}${v.sm ? barRow("Supermarket (max)", v.sm.max) : ""}${v.cr.n ? barRow(`Xaridorlar (${v.cr.n})`, v.cr.med) : ""}</div>
      ${dv ? `<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px"><h3>Chegirma: ${fmt(rep.old)} → ${fmt(rep.price)} soʻm (eʼlon −${Math.round(dv.claim * 100)}%)</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pill(dv.lab, "lg")}<b class="num">${dv.score}/100 xavf</b></div><div class="meter"><i style="width:${dv.score}%;background:${dv.lab === "soxta" ? "var(--crit)" : dv.lab === "chalgituvchi" ? "var(--warn)" : "var(--good)"}"></i></div><div class="why">${dv.parts.map(x => `<div class="w"><b>${esc(x.l)}</b><span class="pts num">${Math.round(x.pts)}/${x.max}</span><span class="tx">${esc(x.tx)}</span><div class="pb"><i style="width:${(x.pts / x.max * 100).toFixed(0)}%"></i></div></div>`).join("")}</div></div>` : ""}
      <ul class="checks">${rep.qa.why.length ? rep.qa.why.map(w => `<li class="no">${IC.warn}<span>${esc(w)}</span></li>`).join("") : `<li class="ok">${IC.ok}<span>Sifat nazoratidan oʻtdi: narx real oraliqda, takror emas, joylashuv bor.</span></li>`}</ul>
      <button class="btn2" data-share="${k}">Natijani ulashish</button>
      ${CAP.sample ? `<div id="ai-${k}"><button class="btn2" data-ai="${k}">AI tushuntirib bersin</button></div>` : ""}

  }).join("");

  ${saved[0] === "qurilma" ? `<p class="note">Xabar shu qurilmada saqlandi${CAP.db ? ": internet qaytganda serverga avtomatik yuboriladi" : ": umumiy baza uchun server ulanmagan"}. Indeks va tarix uchun baribir ishlatiladi.</p>` : ""}`;

  $("#r-home").onclick = () => { closeSheet(); setTab(o.kind === "chegirma" ? "chegirma" : "asosiy"); };
  document.querySelectorAll("#pf-extra [data-share]").forEach(b => b.onclick = () => {
    const { rep, v, dv } = reps[+b.dataset.share];

    try { const tx = await aiExplain("price", ctx); box.innerHTML = `<div class="ai"><b>AI izohi</b>${esc(tx)}</div>`; }
    catch (e) { box.innerHTML = `<p class="note">${aiErr(e)}</p>`; }
  });
  $("#pf-extra").scrollIntoView({ behavior: "smooth", block: "start" });
}

  $("#o-ok").onclick = async () => {
    $("#o-msg").textContent = "Joylashuv soʻralmoqda…"; const g = await getGPS(9000);
    if (g) { saveLoc(locFromCoords(g.la, g.lo, "gps", g.acc)); $("#o-msg").textContent = "Aniqlandi: " + locLine(LOC); setTimeout(done, 900); return; }
    $("#o-msg").textContent = "Joylashuvga ruxsat berilmadi. Uni keyinroq telefon sozlamalaridan yoqishingiz mumkin. Ungacha joylashuv rasmdagi GPS yozuvidan va yorliqdagi doʻkon nomidan olinadi. Hozircha viloyatingizni bir marta tanlang:";
    $("#o-reg").innerHTML = regionGrid(null);
    document.querySelectorAll("#o-reg [data-r]").forEach(b => b.onclick = () => { saveLoc({ la: null, lo: null, r: b.dataset.r, pl: null, ty: null, m: "tanlangan", ts: Date.now() }); done(); });
  };
}

/* ============ Ishga tushirish ============ */
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== TAB) setTab(h, false); });
setTab(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "asosiy", false);
renderLocChip();
if (!LS.get("nr-onb", 0)) onboarding();
if (!NATIVE && "serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(() => { });
if (NATIVE || location.protocol.startsWith("http")) fetch("./ref.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(r => {
  if (r && Array.isArray(r.products) && r.products.length > 10 && r.week >= REF.week) { CAP.refFromDb = r.week > REF0.week; REF = r; indexRef(); renderAll(); }
}).catch(() => { });
initServer();
</script>
